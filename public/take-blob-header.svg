<svg xmlns="http://www.w3.org/2000/svg" width="800" height="256" viewBox="0 0 800 256" preserveAspectRatio="none">
  <rect width="800" height="256" fill="#123a5e"/>
  <path d="M0,0 H800 V128 C 680,180 620,100 510,128 C 390,158 430,222 290,206 C 165,192 185,146 82,154 C 20,158 0,146 0,128 Z" fill="#2dd4bf"/>
  <path d="M0,0 H800 V60 C 700,94 620,34 470,60 C 330,84 310,34 185,50 C 82,64 40,34 0,42 Z" fill="#17a794"/>
  <circle cx="676" cy="52" r="24" fill="#facc15"/>
  <circle cx="108" cy="100" r="7" fill="#123a5e"/>
  <g transform="translate(614,128)" stroke="#eafffb" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="10"/>
    <line x1="14" y1="0" x2="14" y2="10"/>
    <line x1="0" y1="18" x2="0" y2="28"/>
    <line x1="14" y1="18" x2="14" y2="28"/>
  </g>
  <g transform="translate(116,180)" stroke="#123a5e" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="0" x2="16" y2="16"/>
    <line x1="16" y1="0" x2="0" y2="16"/>
  </g>
  <circle cx="410" cy="20" r="4" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="740" cy="150" r="5" fill="#ffffff" fill-opacity="0.4"/>

  <!-- subject symbols: math, science, Thai, English, music, sports -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- math (pi) -->
    <text x="36" y="72" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#ffffff" fill-opacity="0.75" stroke="none">&#960;</text>

    <!-- music note -->
    <g transform="translate(176,138) scale(1.3)">
      <ellipse cx="6" cy="18" rx="3.2" ry="2.4" transform="rotate(-15 6 18)" fill="#ffffff" fill-opacity="0.8" stroke="none"/>
      <path d="M9 18V4"/>
      <path d="M9 4c4 1 5 4 3 7"/>
    </g>

    <!-- Thai: ko-kai -->
    <text x="234" y="228" font-family="'Leelawadee UI','Tahoma','Sarabun',sans-serif" font-size="32" fill="#ffffff" fill-opacity="0.75" stroke="none">ก</text>

    <!-- science (atom) -->
    <g transform="translate(546,44) scale(1.4)">
      <circle cx="12" cy="12" r="1.6" fill="#ffffff" fill-opacity="0.8" stroke="none"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.2"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(120 12 12)"/>
    </g>

    <!-- sports ball -->
    <g transform="translate(686,118) scale(1.3)">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 6.5 15.5 9 14 13.2H10L8.5 9Z"/>
      <path d="M12 6.5V3.2M15.5 9l2.8-1M14 13.2l1.8 2.4M10 13.2 8.2 15.6M8.5 9l-2.8-1"/>
    </g>

    <!-- English: Aa -->
    <text x="546" y="228" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="26" fill="#ffffff" fill-opacity="0.75" stroke="none">Aa</text>
  </g>
</svg>
