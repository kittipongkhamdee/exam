<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <g fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- atom -->
    <g transform="translate(30,40) scale(1.5)">
      <circle cx="12" cy="12" r="1.6" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(120 12 12)" />
    </g>

    <!-- open book -->
    <g transform="translate(120,30) scale(1.5)">
      <path d="M12 6c-2-1-5-1.3-8-0.6v13c3-0.7 6-0.4 8 0.6" />
      <path d="M12 6c2-1 5-1.3 8-0.6v13c-3-0.7-6-0.4-8 0.6" />
      <path d="M12 6v13" />
    </g>

    <!-- graduation cap -->
    <g transform="translate(230,20) scale(1.5)">
      <path d="M2 8l10-4 10 4-10 4-10-4Z" />
      <path d="M6.5 10v4c0 1.4 2.5 2.6 5.5 2.6s5.5-1.2 5.5-2.6v-4" />
      <path d="M22 8v6" />
    </g>

    <!-- globe -->
    <g transform="translate(50,140) scale(1.5)">
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18" />
      <path d="M12 3c3.2 3 3.2 15 0 18" />
      <path d="M12 3c-3.2 3-3.2 15 0 18" />
    </g>

    <!-- calculator -->
    <g transform="translate(160,120) scale(1.4)">
      <rect x="5" y="3" width="14" height="18" rx="2" />
      <rect x="7.2" y="5.2" width="9.6" height="4" rx="0.6" fill="#ffffff" fill-opacity="0.18" stroke="none" />
      <circle cx="8.2" cy="13.5" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="12" cy="13.5" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="15.8" cy="13.5" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="8.2" cy="17.2" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="12" cy="17.2" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="15.8" cy="17.2" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
    </g>

    <!-- palette -->
    <g transform="translate(300,150) scale(1.5)">
      <path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-0.9 2-2 0-0.6-0.2-1-0.5-1.4-0.3-0.4-0.5-0.8-0.5-1.3 0-1 0.8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-5-4.4-7.5-9-7.5Z" />
      <circle cx="8" cy="10" r="1.1" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="8" cy="15" r="1.1" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="13" cy="7.5" r="1.1" fill="#ffffff" fill-opacity="0.5" stroke="none" />
    </g>

    <!-- DNA -->
    <g transform="translate(400,110) scale(1.3)">
      <path d="M8 2c4 4-4 6 0 10s-4 6 0 10" />
      <path d="M16 2c-4 4 4 6 0 10s4 6 0 10" />
      <path d="M8.6 6h6.8 M8 12h8 M8.6 18h6.8" />
    </g>

    <!-- protractor / ruler -->
    <g transform="translate(20,260) scale(1.5)">
      <path d="M3 20 21 20 12 4Z" />
      <path d="M9 20v-3 M12 20v-4 M15 20v-3" />
    </g>

    <!-- flask -->
    <g transform="translate(130,240) scale(1.5)">
      <path d="M9 3h6" />
      <path d="M10 3v6l-5.2 9.2A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.8L14 9V3" />
      <circle cx="9.5" cy="16" r="0.8" fill="#ffffff" fill-opacity="0.5" stroke="none" />
      <circle cx="12.5" cy="18" r="0.9" fill="#ffffff" fill-opacity="0.5" stroke="none" />
    </g>

    <!-- Thai ko-kai -->
    <text x="255" y="278" font-family="'Leelawadee UI','Tahoma','Sarabun',sans-serif" font-size="34" fill="#ffffff" fill-opacity="0.4" stroke="none">ก</text>

    <!-- star -->
    <path transform="translate(370,240) scale(1.3)" d="M12 2.5l2.4 5 5.6 0.6-4.2 3.8 1.2 5.5L12 14.3l-4.9 2.7 1.1-5.5-4.1-3.8 5.6-0.6Z" fill="#ffffff" fill-opacity="0.35" stroke="none" />

    <!-- light bulb -->
    <g transform="translate(70,350) scale(1.5)">
      <circle cx="12" cy="9.5" r="6" />
      <path d="M9.3 16h5.4 M10 19h4" />
      <path d="M12 3v0.01" />
    </g>

    <!-- bar chart -->
    <g transform="translate(170,355) scale(1.4)">
      <path d="M4 21V13 M10 21V7 M16 21V16" />
      <path d="M2 21h18" />
    </g>

    <!-- clock -->
    <g transform="translate(280,350) scale(1.5)">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3.5 2" />
    </g>

    <!-- x-squared -->
    <text x="390" y="380" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ffffff" fill-opacity="0.4" stroke="none">x&#178;</text>

    <!-- sparkle dots -->
    <circle cx="90" cy="90" r="1.4" fill="#ffffff" fill-opacity="0.5" stroke="none" />
    <circle cx="210" cy="60" r="1.6" fill="#ffffff" fill-opacity="0.4" stroke="none" />
    <circle cx="340" cy="90" r="1.3" fill="#ffffff" fill-opacity="0.5" stroke="none" />
    <circle cx="440" cy="250" r="1.5" fill="#ffffff" fill-opacity="0.45" stroke="none" />
    <circle cx="100" cy="230" r="1.3" fill="#ffffff" fill-opacity="0.4" stroke="none" />
    <circle cx="240" cy="190" r="1.6" fill="#ffffff" fill-opacity="0.4" stroke="none" />
    <circle cx="60" cy="440" r="1.4" fill="#ffffff" fill-opacity="0.45" stroke="none" />
    <circle cx="230" cy="440" r="1.3" fill="#ffffff" fill-opacity="0.4" stroke="none" />
    <circle cx="440" cy="440" r="1.5" fill="#ffffff" fill-opacity="0.4" stroke="none" />
  </g>
</svg>
